name: DotNET Test Reporting

# read-write repo token
# access to secrets
on:
  workflow_run:
    workflows: ['DotNET-build']
    types:
      - completed
permissions:
  contents: read
  actions: read
  checks: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/test-reporter@v3
        with:
          artifact: test-results
          name: DotNET - Tests
          path: '**/test-results.trx'
          reporter: dotnet-trx
          fail-on-error: false
